apiVersion: apps/v1
kind: Deployment
metadata:
  name: zaintech-web
  namespace: zaintech
  labels:
    app: zaintech-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zaintech-web
  template:
    metadata:
      labels:
        app: zaintech-web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: web-page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: web-page
          configMap:
            name: zaintech-web-page
