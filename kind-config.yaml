# kind cluster configuration
# One control-plane node + two worker nodes, all running as Docker containers.
# Host port 30080 is mapped into the control-plane node so the NodePort
# service is reachable at http://localhost:30080
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zaintech
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: "0.0.0.0"
        protocol: TCP
  - role: worker
  - role: worker
